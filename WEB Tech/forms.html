<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <h2>Job Application Form</h2>
    <table>
        <fieldset style="border: 2px solid black; width: 600px; padding: 10px">
            <legend>Personal Information</legend>

            <label>First Name:</label><br>
            <input type="text"><br><br>

            <label>Email:</label><br>
            <input type="email"><br><br>

            <label>Create Password:</label> <br>
            <input type ="password"><br><br>

            <label>Phone number:</label><br>
            <input type="number"><br><br>

            <label>Age:</label><br>
            <input type="number"><br><br>

            <label>Date of Birth</label><br>
            <input type="date"><br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender">Male</input>
            <input type="radio" name="gender">Female</input>
            <input type="radio" name="gender">Other</input><br><br>

            <label>Highest Qualification:</label><br>
            <select>
                <option>B.tech</option>
                <option>M.tech</option>
                <option>PhD</option>
            </select><br><br>

            <label>Technical Skills:</label><br>
            <input type="checkbox">Java</input>
            <input type="checkbox">Python</input>
            <input type="checkbox">HTML</input> 
            <input type="checkbox">SQL</input>
            <input type="checkbox">React</input><br><br>

            <label>Upload Resume:</label><br>
            <input type="file"><br><br>


            <label>why should we hire you?</label><br>
            <textarea rows="4" cols="50"></textarea><br><br>
            <input type="submit" value="Submit">
            


        </fieldset>
    </table>
    
</body>
</html>
